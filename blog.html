<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Blog Studio - generate polished blog posts with AI.">
  <title>AI Blog Studio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .blog-wrap{max-width:1100px;margin:0 auto;padding:100px 24px 70px}.blog-hero{text-align:center;margin-bottom:40px}.blog-hero h1{font-size:clamp(42px,7vw,78px);margin:0 0 14px}.blog-hero p{max-width:680px;margin:auto;opacity:.75;font-size:18px}.studio{display:grid;grid-template-columns:360px 1fr;gap:24px}.panel{border:1px solid rgba(127,127,127,.25);border-radius:24px;padding:24px;background:rgba(127,127,127,.06);backdrop-filter:blur(12px)}.panel h2{margin-top:0}.field{margin:0 0 18px}.field label{display:block;font-weight:600;margin-bottom:8px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;border:1px solid rgba(127,127,127,.3);background:transparent;color:inherit;font:inherit}.field textarea{min-height:110px;resize:vertical}.generate{width:100%;padding:14px 18px;border:0;border-radius:12px;cursor:pointer;font-weight:700;font-size:16px}.status{font-size:13px;opacity:.7;margin-top:12px}.output{min-height:560px}.output h2{font-size:34px;margin-bottom:10px}.meta{opacity:.65;font-size:13px;margin-bottom:28px}.content{line-height:1.8;font-size:17px}.content h1,.content h2,.content h3{line-height:1.25}.content ul{padding-left:24px}.empty{height:100%;min-height:500px;display:grid;place-items:center;text-align:center;opacity:.55}.back{display:inline-block;margin-bottom:24px;text-decoration:none}@media(max-width:800px){.studio{grid-template-columns:1fr}.blog-wrap{padding-top:70px}.output{min-height:400px}}
  </style>
</head>
<body>
  <main class="blog-wrap">
    <a class="back" href="index.html">← Back to portfolio</a>
    <section class="blog-hero">
      <p>AI BLOG STUDIO</p>
      <h1>Turn an idea into a blog.</h1>
      <p>Give the AI a topic, choose your style, and get a structured draft you can edit and publish.</p>
    </section>
    <section class="studio">
      <div class="panel">
        <h2>Write with AI</h2>
        <form id="blogForm">
          <div class="field"><label for="topic">Topic</label><input id="topic" required placeholder="e.g. How AI is changing education"></div>
          <div class="field"><label for="audience">Audience</label><input id="audience" placeholder="e.g. students and young professionals"></div>
          <div class="field"><label for="tone">Tone</label><select id="tone"><option>Clear and conversational</option><option>Professional</option><option>Bold and energetic</option><option>Friendly and casual</option></select></div>
          <div class="field"><label for="length">Length</label><select id="length"><option>Short</option><option selected>Medium</option><option>Long</option></select></div>
          <div class="field"><label for="notes">Extra instructions</label><textarea id="notes" placeholder="Add key points, examples, or anything the writer should include..."></textarea></div>
          <button class="generate" type="submit">Generate blog ✨</button>
          <div class="status" id="status"></div>
        </form>
      </div>
      <article class="panel output" id="output">
        <div class="empty">Your generated article will appear here.</div>
      </article>
    </section>
  </main>
  <script src="blog.js"></script>
</body>
</html>
